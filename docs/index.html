<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港賽馬量化分析</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#66707c;--line:#e3e6ea;--accent:#0b6e4f;--accent2:#c9a227;--bad:#b3261e;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e7eaee;--muted:#9aa3ad;--line:#262c34;--accent:#3ccf9a;--accent2:#e5c25a;--bad:#ff8a80;--chip:#222831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI","Noto Sans HK","PingFang HK",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px}
.chip.hl{background:var(--accent);color:#fff}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0}
.note{border-left:3px solid var(--accent2);padding:4px 10px;font-size:14px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
.tblwrap table{min-width:1040px}
.tblwrap td:nth-child(2){white-space:nowrap}
.tblwrap td:last-child{min-width:150px}
th{white-space:nowrap}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pro{color:var(--accent);font-size:12px}.con{color:var(--bad);font-size:12px}
.ai{white-space:pre-wrap;background:var(--chip);border-radius:8px;padding:12px;font-size:14px;margin-top:12px}
.res{font-weight:600;color:var(--accent2)}
.won{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--chip);border-radius:8px;padding:10px}
.kpi b{display:block;font-size:20px}
.warn{font-size:12px;color:var(--muted);margin-top:24px}
.refresh{margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.refresh:disabled{opacity:.5}
.stale{margin-top:8px;color:var(--bad);font-size:14px}
.tag{display:inline-block;background:var(--accent2);color:#1b1f24;border-radius:4px;padding:0 5px;font-size:11px;font-weight:600;margin-left:4px;vertical-align:middle}
.tag.steam{background:var(--accent);color:#fff}
.shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.shots button{border:1px solid var(--accent2);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>香港賽馬量化分析</h1>
  <div class="sub" id="sub">載入中…</div>
  <button id="refresh" class="refresh">重新整理</button>
  <div id="stale" class="stale" style="display:none"></div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <section class="card" id="allshots" style="display:none"></section>
  <section class="card" id="perf"></section>
  <section class="card" id="selfcheck"></section>
  <p class="warn">模型數字係根據歷史數據嘅統計估算,唔係保證。賽馬涉及風險,請量力而為。未滿十八歲人士不得投注。切勿沉迷賭博,如需協助可致電平和基金熱線 1834 633。</p>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data, scData = null, cur = 0;

// GitHub's CDNs ignore query strings and keep a copy per region (Pages up to 10 min,
// raw up to 5), so viewers in different places could see different versions. Reading
// the files at the exact latest commit skips every cache; the others are fallbacks.
const REPO = "kelvin1997121/hkjc-quant";

async function latestSha() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/main`,
      { headers: { Accept: "application/vnd.github.sha" }, cache: "no-store" });
    return r.ok ? (await r.text()).trim() : null;
  } catch { return null; }
}

async function getJSON(name, sha) {
  const urls = [`https://raw.githubusercontent.com/${REPO}/${sha || "main"}/docs/data/${name}`, `data/${name}`];
  const docs = await Promise.all(urls.map(u =>
    fetch(u, { cache: "no-store" }).then(r => (r.ok ? r.json() : null)).catch(() => null)));
  const stamp = d => (d ? Date.parse(d.updated_at || d.checked_at || 0) || 0 : -1);
  return docs.sort((a, b) => stamp(b) - stamp(a))[0];   // newest copy wins
}

const hkToday = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Hong_Kong" });

async function load() {
  const btn = $("#refresh");
  btn.disabled = true;
  const sha = await latestSha();
  const [latest, tr, sc] = await Promise.all(["latest.json", "track_record.json", "selfcheck.json"].map(n => getJSON(n, sha)));
  btn.disabled = false;
  if (!latest) {
    if (!data) $("#sub").textContent = "暫時攞唔到數據,請稍後再試。";
    return;
  }
  data = latest;
  scData = sc;
  selfcheck(sc);
  const m = data.meeting;
  $("#sub").textContent = `${m.date} ${m.venue_zh} · ${data.races.length} 場 · 更新於 ${new Date(data.updated_at).toLocaleString("zh-HK")} · 歷史數據 ${data.history_races} 場`;
  const age = Math.round((Date.now() - Date.parse(data.updated_at)) / 60000);
  const stale = m.date === hkToday() && age > 15;
  $("#stale").style.display = stale ? "" : "none";
  $("#stale").textContent = stale ? `⚠ 數據已經 ${age} 分鐘冇更新,賠率同走勢可能唔係最新。` : "";
  if (!load.done) {
    const next = data.races.findIndex(r => !r.result);
    cur = next >= 0 ? next : 0;
    load.done = true;
  }
  cur = Math.min(cur, data.races.length - 1);
  tabs(); show(); perf(tr); allShots();
}

function tabs() {
  $("#tabs").innerHTML = data.races.map((r, i) =>
    `<button class="${i === cur ? "on" : ""}" data-i="${i}">第${r.race_no}場${r.result ? " ✓" : ""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { cur = +b.dataset.i; tabs(); show(); });
}

function show() {
  const r = data.races[cur];
  const maxp = Math.max(...r.runners.map(x => x.win_prob));
  const winner = r.result ? r.result.placings[0] : null;
  const rows = r.runners.map(x => `
    <tr class="${x.no === winner ? "won" : ""}">
      <td class="num">${x.final_rank ?? x.rank}</td>
      <td><b>${x.no}. ${esc(x.horse)}</b>${x.longshot ? '<span class="tag">冷門</span>' : ""}${x.steam ? '<span class="tag steam">落飛</span>' : ""}<br><span class="sub">${esc(x.jockey)} / ${esc(x.trainer)}</span></td>
      <td class="num">${x.draw ?? ""}</td>
      <td class="num">${x.weight ?? ""}</td>
      <td class="num">${x.rating ?? ""}</td>
      <td>${esc(x.last6 || "")}</td>
      <td>${esc(x.style)}</td>
      <td class="num">${x.speed_best ?? "–"}</td>
      <td class="num">${x.perf_best ?? "–"}${x.handicap_edge ?`<br><span class="${x.handicap_edge > 0 ? "pro" : "con"}">${x.handicap_edge > 0 ? "+" : ""}${x.handicap_edge}</span>` : ""}</td>
      <td class="num">${(x.win_prob * 100).toFixed(1)}%<div class="bar"><i style="width:${x.win_prob / maxp * 100}%"></i></div><span class="sub">模型第 ${x.rank}</span></td>
      <td class="num">${x.fair_odds}</td>
      <td class="num">${x.win_odds ?? "–"}${x.open_odds && x.open_odds !== x.win_odds ? `<br><span class="sub">早 ${x.open_odds}</span>` : ""}${x.place_odds ? `<br><span class="sub">位 ${x.place_odds}</span>` : ""}</td>
      <td class="num">${x.blend_prob != null ? (x.blend_prob * 100).toFixed(1) + "%" : "–"}</td>
      <td class="num">${x.ev != null ? `<span class="${x.value ? "pro" : ""}">${x.ev.toFixed(2)}${x.value ? " 值博" : ""}</span>` : "–"}</td>
      <td>${x.pros.map(p => `<div class="pro">+ ${esc(p)}</div>`).join("")}${x.cons.map(p => `<div class="con">− ${esc(p)}</div>`).join("")}</td>
    </tr>`).join("");
  const res = r.result ? `<div class="res">賽果:${r.result.placings.join(" - ")}(頭馬獨贏 ${r.result.win_odds ?? "-"})${r.post_hoc ? " · 此場預測於賽後產生,不計入往績" : ""}</div>` : "";
  $("#view").innerHTML = `
  <section class="card">
    <h2 style="margin:0">第${r.race_no}場 ${esc(r.race_name || "")}</h2>
    <div class="meta">
      <span class="chip">${esc(r.post_time || "")}</span><span class="chip">${esc(r.class || "")}</span>
      <span class="chip">${r.distance}米</span><span class="chip">${r.surface === "AWT" ? "全天候" : "草地"} ${esc(r.course ? '"' + r.course + '"' : "")}</span>
      <span class="chip">${esc(r.going || "場地未公布")}</span>
      <span class="chip hl">步速:${esc(r.pace)}(${r.n_leaders} 匹前置馬)</span>
      ${r.odds_updated ? `<span class="chip">賠率更新 ${esc(r.odds_updated)}</span>` : ""}
      ${r.confidence ? `<span class="chip">${esc(bandText(r.confidence))}</span>` : ""}
    </div>
    ${edgeNote()}
    ${res}
    <div class="notes">
      <div class="note">${esc(r.pace_note)}</div>
      <div class="note">${esc(r.today_bias)}${r.today_sect ? `<br>${esc(r.today_sect)}` : ""}</div>
      <div class="note">${esc(r.course_bias)}</div>
    </div>
    ${(r.longshots || []).length ? `<div class="note" style="border-color:var(--accent2);margin-bottom:10px"><b>冷門馬:</b>${
      r.longshots.map(x => `${x.no}. ${esc(x.horse)}(獨贏 ${x.win_odds}${x.place_odds ? " / 位 " + x.place_odds : ""},模型排第 ${x.rank},${(x.win_prob * 100).toFixed(1)}%)${x.pros.length ? ":" + esc(x.pros.slice(0, 2).join("、")) : ""}`).join(";")
    }<br><span class="sub">${esc(shotRecord())}</span></div>` : ""}
    <div class="tblwrap"><table>
      <thead><tr><th>排名</th><th>馬匹</th><th>檔</th><th title="已扣見習騎師減磅">實際<br>負磅</th><th>評分</th><th>近績</th><th>跑法</th><th>速度</th><th title="讓磅著數 = 比同場中位數高/低幾多分">表現評分<br>(讓磅著數±)</th><th>模型機率</th><th>公平賠率</th><th>即時賠率</th><th>綜合機率</th><th>EV</th><th>因素</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${r.ai ? `<div class="ai"><b>AI 分析(Claude)</b>\n${esc(r.ai)}</div>`
      : r.summary ? `<div class="ai"><b>系統分析</b>\n${esc(r.summary)}</div>` : ""}
  </section>`;
}

function selfcheck(sc) {
  const el = $("#selfcheck");
  if (!sc) { el.style.display = "none"; return; }
  const pct = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
  const w = sc.walk_forward;
  const health = sc.health.checks.map(c =>
    `<div class="${c.ok ? "pro" : "con"}" style="font-size:14px">${c.ok ? "✓" : "⚠"} ${esc(c.name)}:${esc(c.detail)}</div>`).join("");
  const maxd = Math.max(...sc.factor_groups.map(g => Math.abs(g.delta_logloss)), 0.001);
  const groups = sc.factor_groups.map(g => {
    const good = g.delta_logloss > 0;
    return `<tr><td>${esc(g.group)}</td><td class="num">${g.delta_logloss > 0 ? "+" : ""}${g.delta_logloss.toFixed(4)}</td>
      <td style="width:45%"><div class="bar"><i style="width:${Math.abs(g.delta_logloss) / maxd * 100}%;background:${good ? "var(--accent)" : "var(--bad)"}"></i></div></td></tr>`;
  }).join("");
  const cal = sc.calibration.map(c =>
    `<tr><td>${esc(c.band)}</td><td class="num">${c.n}</td><td class="num">${pct(c.predicted)}</td><td class="num">${pct(c.actual)}</td></tr>`).join("");
  const t = sc.tuning;
  el.innerHTML = `
    <h3 style="margin-top:0">系統自我檢測</h3>
    <div class="sub">每日自動檢查 · 上次 ${new Date(sc.checked_at).toLocaleString("zh-HK")} · ${sc.health.races} 場歷史數據</div>
    <div style="margin:10px 0">${health}</div>
    <div class="kpis">
      <div class="kpi"><b>${pct(w.blend_hit ?? w.top_hit)}</b>綜合首選勝出率(純模型 ${pct(w.top_hit)},大熱門 ${pct(w.favourite_hit)})</div>
      <div class="kpi"><b>${pct(w.first_placed)}</b>綜合首選入位率</div>
      <div class="kpi"><b>${pct(w.winner_in_top2)} / ${pct(w.winner_in_top3)}</b>頭 2 匹 / 頭 3 匹包中頭馬</div>
      <div class="kpi"><b>${w.logloss}</b>Log loss(市場 ${w.market_logloss})</div>
      <div class="kpi"><b>${w.blend_gain > 0 ? "+" : ""}${w.blend_gain} ± ${w.blend_gain_ci}</b>加入模型後對市場嘅改善</div>
      <div class="kpi"><b>l2 ${t.chosen.l2} · ${t.chosen.stages === 1 ? "頭馬" : "頭三名"}</b>${t.switched ? "今日自動調校咗設定" : "設定維持不變"}</div>
    </div>
    ${sc.notes.map(n => `<div class="note" style="margin-top:8px">${esc(n)}</div>`).join("")}
    ${sc.pick_bands ? `<div class="sub" style="margin-top:12px">系統首選按賠率分級(最終賠率回測;把握高唔代表值博,三級都係輸錢居多)</div>
      <table><thead><tr><th>把握</th><th>首選賠率</th><th>場數</th><th>勝出</th><th>入位</th><th>平注回報</th></tr></thead><tbody>${
        [["高", "≤ 2.5"], ["中", "2.5 – 4"], ["低", "> 4"]].filter(([k]) => sc.pick_bands[k]).map(([k, o]) => {
          const b = sc.pick_bands[k];
          return `<tr><td>${k}</td><td>${o}</td><td class="num">${b.n}</td><td class="num">${pct(b.win)}</td><td class="num">${pct(b.place)}</td><td class="num">${(b.roi * 100).toFixed(0)}%</td></tr>`;
        }).join("")}</tbody></table>` : ""}
    <div class="notes" style="margin-top:12px">
      <div><div class="sub">因素組貢獻(拎走後 log loss 變差幾多;紅色 = 拎走反而更準)</div>
        <table><tbody>${groups}</tbody></table></div>
      <div><div class="sub">機率校準(預測 vs 實際勝出率)</div>
        <table><thead><tr><th>區間</th><th>馬次</th><th>預測</th><th>實際</th></tr></thead><tbody>${cal}</tbody></table></div>
    </div>`;
}

function shotRecord() {
  const ls = scData && scData.longshots;
  if (!ls || !ls.picked || !ls.all_longshots) return "";
  const p = ls.picked, b = ls.all_longshots, pct = v => (v * 100).toFixed(1) + "%";
  return `過往回測(${p.n} 匹同類馬):入位率 ${pct(p.top3)}(一般冷門 ${pct(b.top3)}),勝出率 ${pct(p.win)},` +
    `獨贏平注回報 ${(p.win_roi * 100).toFixed(0)}%。較適合位置或者連贏配腳,唔建議重注獨贏。`;
}

function allShots() {
  const el = $("#allshots");
  const items = data.races.flatMap((r, i) => (r.longshots || []).map(x => ({ i, r, x })));
  if (!items.length) { el.style.display = "none"; return; }
  el.style.display = "";
  el.innerHTML = `<b>今日冷門馬</b> <span class="sub">(獨贏 10 倍以上而模型排頭五)</span>
    <div class="shots">${items.map(({ i, r, x }) =>
      `<button data-i="${i}">第${r.race_no}場 ${x.no}. ${esc(x.horse)} · ${x.win_odds}倍${r.result ? (r.result.placings.includes(x.no) ? " ✓入位" : "") : ""}</button>`).join("")}</div>
    <div class="sub" style="margin-top:6px">${esc(shotRecord())}</div>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { cur = +b.dataset.i; tabs(); show(); });
}

function bandText(level) {
  const b = scData && scData.pick_bands && scData.pick_bands[level];
  return b ? `把握${level}:歷來勝 ${Math.round(b.win * 100)}%,入位 ${Math.round(b.place * 100)}%` : `把握${level}`;
}

function edgeNote() {
  const b = data.model && data.model.blend;
  if (!b) return "";
  if (b.a === 0) return `<div class="note" style="border-color:var(--bad)">回測顯示模型暫時未有市場賠率以外嘅資訊(綜合權重:模型 0 / 市場 ${b.b}),所以排名(綜合機率)≈ 市場賠率,唔會標「值博」;想睇模型自己嘅睇法,請睇「模型第幾」。</div>`;
  return `<div class="note">排名按綜合機率 = 模型權重 ${b.a} + 市場權重 ${b.b}(喺未見過嘅賽事回測得出)。EV ≥ 1.15 先標「值博」;賠率會變,以落注一刻為準。</div>`;
}

function perf(tr) {
  const h = data.model && data.model.holdout;
  const pct = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
  let html = "<h3 style='margin-top:0'>模型表現</h3>";
  if (h) {
    html += `<div class="sub">回測(${h.races} 場,由 ${esc(data.model.holdout_from)} 起,模型未見過嘅數據)</div><div class="kpis">
      <div class="kpi"><b>${pct(h.top_pick_win_rate)}</b>模型首選勝出率</div>
      <div class="kpi"><b>${pct(h.favourite_win_rate)}</b>大熱門勝出率(對照)</div>
      <div class="kpi"><b>${h.logloss}</b>Log loss(市場 ${h.market_logloss},隨機 ${h.uniform_logloss})</div>
      <div class="kpi"><b>${pct(h.flat_bet_roi_top_pick)}</b>首選平注回報率</div></div>`;
  }
  if (tr && tr.races) {
    html += `<div class="sub" style="margin-top:12px">實戰往績(賽前鎖定嘅預測)</div><div class="kpis">
      <div class="kpi"><b>${tr.races}</b>場</div>
      <div class="kpi"><b>${pct(tr.wins / tr.races)}</b>首選勝出</div>
      <div class="kpi"><b>${pct(tr.places / tr.races)}</b>首選入位</div>
      <div class="kpi"><b>${pct(tr.flat_roi)}</b>平注回報率</div></div>`;
  }
  $("#perf").innerHTML = html;
}

$("#refresh").onclick = load;
load();
// every 2 minutes on a race day, every 10 otherwise; skipped while the tab is hidden
let ticks = 0;
setInterval(() => {
  ticks++;
  if (document.hidden) return;
  if ((data && data.meeting.date === hkToday()) || ticks % 5 === 0) load();
}, 2 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
