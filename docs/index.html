<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港賽馬量化分析</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#66707c;--line:#e3e6ea;--accent:#0b6e4f;--accent2:#c9a227;--bad:#b3261e;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e7eaee;--muted:#9aa3ad;--line:#262c34;--accent:#3ccf9a;--accent2:#e5c25a;--bad:#ff8a80;--chip:#222831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI","Noto Sans HK","PingFang HK",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px}
.chip.hl{background:var(--accent);color:#fff}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0}
.note{border-left:3px solid var(--accent2);padding:4px 10px;font-size:14px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
.tblwrap table{min-width:1040px}
.tblwrap td:nth-child(2){white-space:nowrap}
.tblwrap td:last-child{min-width:150px}
th{white-space:nowrap}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pro{color:var(--accent);font-size:12px}.con{color:var(--bad);font-size:12px}
.ai{white-space:pre-wrap;background:var(--chip);border-radius:8px;padding:12px;font-size:14px;margin-top:12px}
.res{font-weight:600;color:var(--accent2)}
.won{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--chip);border-radius:8px;padding:10px}
.kpi b{display:block;font-size:20px}
.warn{font-size:12px;color:var(--muted);margin-top:24px}
.refresh{margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.refresh:disabled{opacity:.5}
.stale{margin-top:8px;color:var(--bad);font-size:14px}
.tag{display:inline-block;background:var(--accent2);color:#1b1f24;border-radius:4px;padding:0 5px;font-size:11px;font-weight:600;margin-left:4px;vertical-align:middle}
.tag.steam{background:var(--accent);color:#fff}
.tag.strong{background:transparent;color:var(--ink);border:1px solid var(--accent2)}
.shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.shots button{border:1px solid var(--accent2);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.pages{display:flex;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;max-width:100%}
.pages button{border:0;background:var(--card);color:var(--ink);padding:8px 18px;font-size:15px;cursor:pointer}
.pages button+button{border-left:1px solid var(--line)}
.pages button.on{background:var(--accent);color:#fff;font-weight:600}
details.mt{border-top:1px solid var(--line);padding:8px 0}
details.mt summary{cursor:pointer;font-weight:600}
.tw{overflow-x:auto}
.tw table{min-width:560px}
.pos{color:var(--accent)}.neg{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>香港賽馬量化分析</h1>
  <div class="sub" id="sub">載入中…</div>
  <button id="refresh" class="refresh">重新整理</button>
  <div id="stale" class="stale" style="display:none"></div>
</header>
<main>
  <nav class="pages" id="pages">
    <button data-p="race">賽事分析</button><button data-p="paper">模擬倉</button>
  </nav>
  <div id="racepage">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
    <section class="card" id="allshots" style="display:none"></section>
    <section class="card" id="perf"></section>
    <section class="card" id="selfcheck"></section>
  </div>
  <div id="paperpage" hidden>
    <section class="card"><div class="sub">模擬倉數據載入中…</div></section>
  </div>
  <p class="warn">模型數字係根據歷史數據嘅統計估算,唔係保證。賽馬涉及風險,請量力而為。未滿十八歲人士不得投注。切勿沉迷賭博,如需協助可致電平和基金熱線 1834 633。</p>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data, scData = null, ppData = null, obData = null, cur = 0;

// two pages: race analysis and the paper account; remembered in the address (#paper)
let page = location.hash === "#paper" ? "paper" : "race";
function setPage(p) {
  page = p;
  $("#racepage").hidden = p !== "race";
  $("#paperpage").hidden = p !== "paper";
  document.querySelectorAll("#pages button").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  try { history.replaceState(null, "", p === "paper" ? "#paper" : location.pathname + location.search); } catch {}
}
document.querySelectorAll("#pages button").forEach(b => b.onclick = () => { setPage(b.dataset.p); window.scrollTo(0, 0); });
window.addEventListener("hashchange", () => setPage(location.hash === "#paper" ? "paper" : "race"));
setPage(page);

// GitHub's CDNs ignore query strings and keep a copy per region (Pages up to 10 min,
// raw up to 5), so viewers in different places could see different versions. Reading
// the files at the exact latest commit skips every cache; the others are fallbacks.
const REPO = "kelvin1997121/hkjc-quant";

async function latestSha() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/main`,
      { headers: { Accept: "application/vnd.github.sha" }, cache: "no-store" });
    return r.ok ? (await r.text()).trim() : null;
  } catch { return null; }
}

async function getJSON(name, sha) {
  const urls = [`https://raw.githubusercontent.com/${REPO}/${sha || "main"}/docs/data/${name}`, `data/${name}`];
  const docs = await Promise.all(urls.map(u =>
    fetch(u, { cache: "no-store" }).then(r => (r.ok ? r.json() : null)).catch(() => null)));
  const stamp = d => (d ? Date.parse(d.updated_at || d.checked_at || 0) || 0 : -1);
  return docs.sort((a, b) => stamp(b) - stamp(a))[0];   // newest copy wins
}

const hkToday = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Hong_Kong" });

async function load() {
  const btn = $("#refresh");
  btn.disabled = true;
  const sha = await latestSha();
  const [latest, tr, sc, pp, ob] = await Promise.all(["latest.json", "track_record.json", "selfcheck.json", "paper.json", "oldbank.json"].map(n => getJSON(n, sha)));
  ppData = pp;
  obData = ob;
  btn.disabled = false;
  if (!latest) {
    if (!data) $("#sub").textContent = "暫時攞唔到數據,請稍後再試。";
    return;
  }
  data = latest;
  scData = sc;
  selfcheck(sc);
  const m = data.meeting;
  $("#sub").textContent = `${m.date} ${m.venue_zh} · ${data.races.length} 場 · 更新於 ${new Date(data.updated_at).toLocaleString("zh-HK")} · 歷史數據 ${data.history_races} 場`;
  const age = Math.round((Date.now() - Date.parse(data.updated_at)) / 60000);
  const stale = m.date === hkToday() && age > 15;
  $("#stale").style.display = stale ? "" : "none";
  $("#stale").textContent = stale ? `⚠ 數據已經 ${age} 分鐘冇更新,賠率同走勢可能唔係最新。` : "";
  if (!load.done) {
    const next = data.races.findIndex(r => !r.result);
    cur = next >= 0 ? next : 0;
    load.done = true;
  }
  cur = Math.min(cur, data.races.length - 1);
  tabs(); show(); perf(tr); allShots(); paperCard();
}

function tabs() {
  $("#tabs").innerHTML = data.races.map((r, i) =>
    `<button class="${i === cur ? "on" : ""}" data-i="${i}">第${r.race_no}場${r.result ? " ✓" : ""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { cur = +b.dataset.i; tabs(); show(); });
}

function show() {
  const r = data.races[cur];
  const maxp = Math.max(...r.runners.map(x => x.win_prob));
  const winner = r.result ? r.result.placings[0] : null;
  const rows = r.runners.map(x => `
    <tr class="${x.no === winner ? "won" : ""}">
      <td class="num">${x.final_rank ?? x.rank}</td>
      <td><b>${x.no}. ${esc(x.horse)}</b>${x.longshot ? '<span class="tag">冷門</span>' : ""}${x.steam ? '<span class="tag steam">落飛</span>' : ""}${(x.strong || []).length ? `<span class="tag strong" title="${esc(x.strong.map(strongText).join(";"))}">強組</span>` : ""}<br><span class="sub">${esc(x.jockey)} / ${esc(x.trainer)}</span></td>
      <td class="num">${x.draw ?? ""}</td>
      <td class="num">${x.weight ?? ""}</td>
      <td class="num">${x.rating ?? ""}</td>
      <td>${esc(x.last6 || "")}</td>
      <td>${esc(x.style)}</td>
      <td class="num">${x.speed_best ?? "–"}</td>
      <td class="num">${x.perf_best ?? "–"}${x.handicap_edge ?`<br><span class="${x.handicap_edge > 0 ? "pro" : "con"}">${x.handicap_edge > 0 ? "+" : ""}${x.handicap_edge}</span>` : ""}</td>
      <td class="num">${(x.win_prob * 100).toFixed(1)}%<div class="bar"><i style="width:${x.win_prob / maxp * 100}%"></i></div></td>
      <td class="num">${x.fair_odds}</td>
      <td class="num">${x.win_odds ?? "–"}${x.open_odds && x.open_odds !== x.win_odds ? `<br><span class="sub">早 ${x.open_odds}</span>` : ""}${x.place_odds ? `<br><span class="sub">位 ${x.place_odds}</span>` : ""}</td>
      <td class="num">${x.blend_prob != null ? (x.blend_prob * 100).toFixed(1) + "%" : "–"}</td>
      <td class="num">${x.ev != null ? `<span class="${x.value ? "pro" : ""}">${x.ev.toFixed(2)}${x.value ? " 值博" : ""}</span>` : "–"}</td>
      <td>${x.pros.map(p => `<div class="pro">+ ${esc(p)}</div>`).join("")}${x.cons.map(p => `<div class="con">− ${esc(p)}</div>`).join("")}</td>
    </tr>`).join("");
  const res = r.result ? `<div class="res">賽果:${r.result.placings.join(" - ")}(頭馬獨贏 ${r.result.win_odds ?? "-"})${r.post_hoc ? " · 此場預測於開跑後產生,不計入往績" : ""}</div>` : "";
  $("#view").innerHTML = `
  <section class="card">
    <h2 style="margin:0">第${r.race_no}場 ${esc(r.race_name || "")}</h2>
    <div class="meta">
      <span class="chip">${esc(r.post_time || "")}</span><span class="chip">${esc(r.class || "")}</span>
      <span class="chip">${r.distance}米</span><span class="chip">${r.surface === "AWT" ? "全天候" : "草地"} ${esc(r.course ? '"' + r.course + '"' : "")}</span>
      <span class="chip">${esc(r.going || "場地未公布")}</span>
      <span class="chip hl">步速:${esc(r.pace)}(${r.n_leaders} 匹前置馬)</span>
      ${r.odds_updated ? `<span class="chip">賠率更新 ${esc(r.odds_updated)}</span>` : ""}
      ${r.confidence ? `<span class="chip">${esc(bandText(r.confidence))}</span>` : ""}
    </div>
    ${edgeNote()}
    ${modelNote(r)}
    ${res}
    ${paperRace(r)}
    <div class="notes">
      <div class="note">${esc(r.pace_note)}</div>
      <div class="note">${esc(r.today_bias)}${r.today_sect ? `<br>${esc(r.today_sect)}` : ""}</div>
      <div class="note">${esc(r.course_bias)}</div>
    </div>
    ${(r.longshots || []).length ? `<div class="note" style="border-color:var(--accent2);margin-bottom:10px"><b>冷門馬:</b>${
      r.longshots.map(x => `${x.no}. ${esc(x.horse)}(獨贏 ${x.win_odds}${x.place_odds ? " / 位 " + x.place_odds : ""},模型排第 ${x.rank},${(x.win_prob * 100).toFixed(1)}%)${x.pros.length ? ":" + esc(x.pros.slice(0, 2).join("、")) : ""}`).join(";")
    }<br><span class="sub">${esc(shotRecord())}</span></div>` : ""}
    ${r.runners.some(x => (x.strong || []).length) ? `<div class="note" style="margin-bottom:10px"><b>出自強組:</b>${
      r.runners.filter(x => (x.strong || []).length).map(x => `${x.no}. ${esc(x.horse)}(${esc(x.strong.map(strongText).join(";"))})`).join(";")
    }<br><span class="sub">強組 = 上兩仗之中有一場跑得快過同班平均(每公里 0.3 秒或以上)，而且嗰場起碼 3 匹輸馬下一仗就入頭三。2020–22 年舊賽事有呢個標記嘅馬贏 220 場，賠率預期 230 場：市場已經計咗，只作參考，唔影響排名。</span></div>` : ""}
    <div class="tblwrap"><table>
      <thead><tr><th>排名</th><th>馬匹</th><th>檔</th><th title="已扣見習騎師減磅">實際<br>負磅</th><th>評分</th><th>近績</th><th>跑法</th><th>速度</th><th title="讓磅著數 = 比同場中位數高/低幾多分">表現評分<br>(讓磅著數±)</th><th>模型機率<br>(參考)</th><th>公平賠率<br>(模型)</th><th>即時賠率</th><th>綜合機率</th><th>EV</th><th>因素</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${r.ai ? `<div class="ai"><b>AI 分析(Claude)</b>\n${esc(r.ai)}</div>`
      : r.summary ? `<div class="ai"><b>系統分析</b>\n${esc(r.summary)}</div>` : ""}
  </section>`;
}

function selfcheck(sc) {
  const el = $("#selfcheck");
  if (!sc) { el.style.display = "none"; return; }
  const pct = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
  const w = sc.walk_forward;
  const health = sc.health.checks.map(c => {
    const [cls, mark] = c.ok === null ? ["sub", "⏳"] : c.ok ? ["pro", "✓"] : ["con", "⚠"];  // null = can't be tested yet
    return `<div class="${cls}" style="font-size:14px">${mark} ${esc(c.name)}:${esc(c.detail)}</div>`;
  }).join("");
  const maxd = Math.max(...sc.factor_groups.map(g => Math.abs(g.delta_logloss)), 0.001);
  const groups = sc.factor_groups.map(g => {
    const good = g.delta_logloss > 0;
    return `<tr><td>${esc(g.group)}</td><td class="num">${g.delta_logloss > 0 ? "+" : ""}${g.delta_logloss.toFixed(4)}</td>
      <td style="width:45%"><div class="bar"><i style="width:${Math.abs(g.delta_logloss) / maxd * 100}%;background:${good ? "var(--accent)" : "var(--bad)"}"></i></div></td></tr>`;
  }).join("");
  const cal = sc.calibration.map(c =>
    `<tr><td>${esc(c.band)}</td><td class="num">${c.n}</td><td class="num">${pct(c.predicted)}</td><td class="num">${pct(c.actual)}</td></tr>`).join("");
  const t = sc.tuning;
  el.innerHTML = `
    <h3 style="margin-top:0">系統自我檢測</h3>
    <div class="sub">每日自動檢查 · 上次 ${new Date(sc.checked_at).toLocaleString("zh-HK")} · ${sc.health.races} 場歷史數據</div>
    <div style="margin:10px 0">${health}</div>
    <div class="kpis">
      <div class="kpi"><b>${pct(w.blend_hit ?? w.top_hit)}</b>綜合首選勝出率(純模型 ${pct(w.top_hit)},大熱門 ${pct(w.favourite_hit)})</div>
      <div class="kpi"><b>${pct(w.first_placed)}</b>綜合首選入位率</div>
      <div class="kpi"><b>${pct(w.winner_in_top2)} / ${pct(w.winner_in_top3)}</b>頭 2 匹 / 頭 3 匹包中頭馬</div>
      <div class="kpi"><b>${w.logloss}</b>Log loss(市場 ${w.market_logloss})</div>
      <div class="kpi"><b>${w.blend_gain > 0 ? "+" : ""}${w.blend_gain} ± ${w.blend_gain_ci}</b>加入模型後對市場嘅改善</div>
      <div class="kpi"><b>l2 ${t.chosen.l2} · ${t.chosen.stages === 1 ? "頭馬" : "頭三名"}</b>${t.switched ? "今日自動調校咗設定" : "設定維持不變"}</div>
    </div>
    ${sc.notes.map(n => `<div class="note" style="margin-top:8px">${esc(n)}</div>`).join("")}
    ${sc.pick_bands ? `<div class="sub" style="margin-top:12px">系統首選按賠率分級(最終賠率回測;把握高唔代表值博,三級都係輸錢居多)</div>
      <div class="tblwrap"><table><thead><tr><th>把握(首選賠率)</th><th>場數</th><th>勝出</th><th>入位</th><th>獨贏回報</th><th>位置回報</th></tr></thead><tbody>${
        [["高", "≤2.5"], ["中", "2.5–4"], ["低", ">4"]].filter(([k]) => sc.pick_bands[k]).map(([k, o]) => {
          const b = sc.pick_bands[k];
          return `<tr><td>${k}(${o})</td><td class="num">${b.n}</td><td class="num">${pct(b.win)}</td><td class="num">${pct(b.place)}</td><td class="num">${(b.roi * 100).toFixed(0)}%</td><td class="num">${b.place_roi == null ? "–" : (b.place_roi * 100).toFixed(0) + "%"}</td></tr>`;
        }).join("")}</tbody></table></div>` : ""}
    ${sc.bet_returns ? betTable(sc.bet_returns) : ""}
    ${sc.learning ? learnTable(sc.learning) : ""}
    ${obData ? oldbankTable(obData) : ""}
    <div class="notes" style="margin-top:12px">
      <div><div class="sub">因素組貢獻(拎走後 log loss 變差幾多;紅色 = 拎走反而更準)</div>
        <table><tbody>${groups}</tbody></table></div>
      <div><div class="sub">機率校準(預測 vs 實際勝出率)</div>
        <table><thead><tr><th>區間</th><th>馬次</th><th>預測</th><th>實際</th></tr></thead><tbody>${cal}</tbody></table></div>
    </div>`;
}

function learnTable(tests) {
  const last = t => t.last ? `${t.last.at} 場時 z ${t.last.z > 0 ? "+" : ""}${t.last.z}` : "–";
  const rows = tests.map(t => `<tr><td>${esc(t.test)}</td><td>${esc(t.status)}</td><td class="num">${t.races}</td>` +
    `<td class="num">${t.next ?? "–"}</td><td>${esc(last(t))}</td></tr>`).join("");
  return `<div class="sub" style="margin-top:12px">自我學習:每個改動只用登記之後嘅新賽事評分,去到 300、500、800 場各判斷一次,z ≥ 2.5 先會自動改模型</div>
    <div class="tblwrap"><table><thead><tr><th>測試</th><th>狀態</th><th>新賽事</th><th>下次判斷</th><th>最近結果</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// 強組 mark of one earlier run (hkjc/strong.py)
function strongText(s) {
  const [, m, d] = s.date.split("-").map(Number);
  const where = { ST: "沙田", HV: "跑馬地" }[s.venue] || s.venue;
  return `${m}/${d} ${where}第${s.race_no}場${s.place ? " 跑第" + s.place : ""},嗰場快過同班每公里 ${s.faster.toFixed(2)} 秒,${s.placed} 匹輸馬下一仗入頭三`;
}

// one-off test on seasons the system had never seen (hkjc/oldbank.py, oldbank.json)
function oldbankTable(o) {
  const rows = o.results.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.z > 0 ? "+" : ""}${r.z}</td>` +
    `<td>${esc(r.flag)} ${r.flagged} 匹:贏 ${r.wins},市場預期 ${r.expected}</td><td>${r.passed ? "過關" : "唔過關"}</td></tr>`).join("");
  const verdict = o.passed_any
    ? "有因素過關,會加入模型再睇綜合權重。"
    : `${o.results.length} 個因素全部唔過關:有呢啲情況嘅馬，實際勝出次數同市場賠率預期差唔多，即係賠率已經計咗。`;
  return `<div class="sub" style="margin-top:12px">舊季度一次性測試(${esc(o.seasons)},${o.judged_races} 場評分;規則 ${esc(o.registered)} 喺下載數據前登記;要 z ≥ ${o.z_pass} 先過關)</div>
    <div class="note" style="margin:6px 0">${verdict}</div>
    <div class="tblwrap"><table><thead><tr><th>因素</th><th>z</th><th>實際 vs 市場</th><th>結果</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function betTable(b) {
  const all = [...b.unseen, ...b.history];
  const pct = v => (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
  const row = x => `<tr><td>${esc(x.name)}</td><td class="num">${x.bets}</td><td class="num">${(x.hit * 100).toFixed(1)}%</td>` +
    `<td class="num">${pct(x.roi)}</td><td class="num">${pct(x.low)} 至 ${pct(x.high)}</td></tr>`;
  const clear = all.filter(x => x.low > 0).map(x => x.name);
  const verdict = clear.length
    ? `${clear.map(esc).join("、")} 嘅範圍高過 0,但同時試咗 ${all.length} 種玩法,可能只係運氣,要用新賽事再驗證。`
    : `${all.length} 種玩法冇一種可靠咁賺錢。中得多唔等於賺到:入位率高嘅玩法一樣蝕。`;
  return `<div class="sub" style="margin-top:12px">真實派彩回測(每注 $10 平注;範圍 = 95% 機會落喺呢度。用最終賠率揀馬,實際落注未必做到)</div>
    <div class="note" style="margin:6px 0">${verdict}</div>
    <div class="tblwrap"><table><thead><tr><th>玩法</th><th>注數</th><th>中率</th><th>回報</th><th>範圍</th></tr></thead><tbody>${all.map(row).join("")}</tbody></table></div>`;
}

function shotRecord() {
  const ls = scData && scData.longshots;
  if (!ls || !ls.picked || !ls.same_price) return "";
  const p = ls.picked, pct = v => (v * 100).toFixed(1) + "%", whole = v => (v * 100).toFixed(0) + "%";
  const same = ls.same_price.map(b => `${b.band} 倍 ${pct(b.picked)}(其他馬 ${pct(b.others)})`).join("、");
  const pair = scData.bet_returns && scData.bet_returns.unseen.find(b => b.name === "首選+冷門馬 連贏");
  return `過往回測(${p.n} 匹同類馬):同賠率比較入位率,${same}。平注回報:獨贏 ${whole(p.win_roi)}、` +
    `位置 ${whole(p.place_roi)}${pair ? `、連贏配首選 ${whole(pair.roi)}` : ""}。呢啲都係蝕錢,只供參考,唔係值博訊號。`;
}

function allShots() {
  const el = $("#allshots");
  const items = data.races.flatMap((r, i) => (r.longshots || []).map(x => ({ i, r, x })));
  if (!items.length) { el.style.display = "none"; return; }
  el.style.display = "";
  el.innerHTML = `<b>今日冷門馬</b> <span class="sub">(獨贏 10 倍以上而模型排頭五)</span>
    <div class="shots">${items.map(({ i, r, x }) =>
      `<button data-i="${i}">第${r.race_no}場 ${x.no}. ${esc(x.horse)} · ${x.win_odds}倍${r.result ? (r.result.placings.includes(x.no) ? " ✓入位" : "") : ""}</button>`).join("")}</div>
    <div class="sub" style="margin-top:6px">${esc(shotRecord())}</div>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { cur = +b.dataset.i; tabs(); show(); });
}

function bandText(level) {
  const b = scData && scData.pick_bands && scData.pick_bands[level];
  return b ? `把握${level}:歷來勝 ${Math.round(b.win * 100)}%,入位 ${Math.round(b.place * 100)}%` : `把握${level}`;
}

function modelNote(r) {
  // the model's own favourite, when it isn't the published first choice
  const top = r.runners[0], own = r.runners.reduce((a, x) => (x.rank < a.rank ? x : a), r.runners[0]);
  if (!top.blend_prob || own.no === top.no) return "";
  const w = scData && scData.walk_forward, pct = v => Math.round(v * 100) + "%";
  const why = w && w.top_hit != null && w.blend_hit != null
    ? `回測入面模型自己首選勝出率 ${pct(w.top_hit)},低過排名第一嘅 ${pct(w.blend_hit)},所以唔計入排名,只作參考。`
    : "模型自己嘅睇法唔計入排名,只作參考。";
  return `<div class="note sub" style="margin-bottom:10px">模型自己會揀 ${own.no}. ${esc(own.horse)}` +
    `(獨贏 ${own.win_odds ?? "–"} 倍,排名第 ${own.final_rank ?? "–"})。${why}</div>`;
}

function edgeNote() {
  const b = data.model && data.model.blend;
  if (!b) return "";
  if (b.a === 0) return `<div class="note" style="border-color:var(--bad)">回測顯示模型暫時未有市場賠率以外嘅資訊(綜合權重:模型 0 / 市場 ${b.b}),所以排名(綜合機率)≈ 市場賠率,唔會標「值博」。模型自己嘅睇法只作參考,唔影響排名。</div>`;
  return `<div class="note">排名按綜合機率 = 模型權重 ${b.a} + 市場權重 ${b.b}(喺未見過嘅賽事回測得出)。EV ≥ 1.15 先標「值博」;賠率會變,以落注一刻為準。</div>`;
}

// ---- 模擬倉 (paper.json, built by hkjc/paper.py)
const money = v => (v > 0 ? "+" : v < 0 ? "-" : "") + "$" + Math.abs(v).toLocaleString("en", { maximumFractionDigits: 0 });
const STATE = { planned: "暫定(開跑前會跟賠率變)", placed: "已落注,等賽果", settled: "已結算",
  post_hoc: "開跑後先有分析,唔落注", void: "冇派彩數據,當冇落注" };

function betText(b) {
  const why = b.value != null ? `,機會 ${(b.chance * 100).toFixed(1)}% × 賠率 ${b.odds} = ${b.value}` : b.odds ? `,賠率 ${b.odds}` : "";
  const paid = b.back == null ? "" : b.refund ? " · 退款" : b.back > 0 ? ` · <b class="pos">派 $${b.back}</b>` : ` · <span class="neg">冇中</span>`;
  return `${esc(b.pool)} ${esc(b.sel)}(${esc(b.names)}${esc(why)})${b.placed ? "" : " · 本金唔夠,冇落"}${paid}`;
}

function paperMeeting() {
  if (!ppData || !data) return null;
  const m = data.meeting;
  return (ppData.meetings || []).find(x => x.date === m.date && x.venue === m.venue) || null;
}

function paperRace(r) {
  const mt = paperMeeting(), pr = mt && mt.races.find(x => x.race_no === r.race_no);
  if (!pr) return "";
  const name = esc((ppData.books.find(b => b.key === pr.following) || {}).name || "");
  const body = pr.main.length ? pr.main.map(betText).join(";") : "今場冇注";
  return `<div class="note" style="margin-bottom:10px"><b>模擬倉(${name}):</b>${body} <span class="sub">· ${esc(STATE[pr.state] || "")}</span></div>`;
}

function paperMeetingBlock(p, mt, open, openInner) {
  const placed = r => r.main.filter(b => b.placed);
  const done = mt.races.flatMap(r => placed(r).filter(b => b.back != null));
  const net = done.reduce((s, b) => s + b.back - b.stake, 0);
  const head = `${esc(mt.date)} ${esc(mt.venue_zh || "")} · ${mt.races.reduce((s, r) => s + placed(r).length, 0)} 注` +
    (done.length ? ` · 已結算 <span class="${net > 0 ? "pos" : net < 0 ? "neg" : ""}">${money(net)}</span>` : " · 未結算");
  const rows = mt.races.map(r => `<tr><td>第${r.race_no}場<div class="sub">${esc(r.post_time || "")}</div></td>
      <td>${r.main.length ? r.main.map(betText).join("<br>") : "–"}</td>
      <td>${esc(STATE[r.state] || "")}${r.result ? `<div class="sub">賽果 ${r.result.join("-")}</div>` : ""}</td></tr>`).join("");
  const others = mt.races.map(r => `<tr><td>第${r.race_no}場</td>${p.books.map(b =>
      `<td>${(r.books[b.key] || []).length ? r.books[b.key].map(betText).join("<br>") : "–"}</td>`).join("")}</tr>`).join("");
  const k = esc(mt.date + mt.venue);
  return `<details class="mt" data-k="${k}"${open ? " open" : ""}><summary>${head}</summary>
    <div class="sub" style="margin-top:8px">策略分析</div>
    ${mt.review.map(t => `<div class="note" style="margin-top:6px">${esc(t)}</div>`).join("")}
    <div class="tw" style="margin-top:8px"><table><thead><tr><th>場次</th><th>模擬倉注項</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>
    <details class="mi" data-k="${k}" style="margin-top:8px"${openInner ? " open" : ""}><summary class="sub">四個策略每場注項</summary>
      <div class="tw"><table style="min-width:900px"><thead><tr><th>場次</th>${p.books.map(b => `<th>${esc(b.name)}</th>`).join("")}</tr></thead><tbody>${others}</tbody></table></div>
    </details></details>`;
}

function paperCard() {
  const el = $("#paperpage"), p = ppData;
  if (!p || !p.books) { el.innerHTML = `<section class="card"><div class="sub">模擬倉暫時未有數據(由 2026-11-11 跑馬地開始)。</div></section>`; return; }
  const mn = p.main, pct = v => v == null ? "–" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
  // the page reloads every few minutes: keep whichever days the viewer has opened or closed
  const seen = el.querySelectorAll("details.mt").length > 0;
  const openNow = sel => new Set([...el.querySelectorAll(sel)].filter(d => d.open).map(d => d.dataset.k));
  const openMt = openNow("details.mt"), openMi = openNow("details.mi");
  const isOpen = (mt, i) => seen ? openMt.has(mt.date + mt.venue) : i === 0;
  const books = p.books.map(b => `<tr${b.key === mn.following ? ' class="won"' : ""}><td><b>${esc(b.name)}</b>${b.key === mn.following ? " ← 模擬倉跟緊" : ""}<div class="sub">${esc(b.rule)}</div></td>
      <td class="num">$${b.balance.toLocaleString()}</td><td class="num">${b.bets}${b.pending ? `<div class="sub">${b.pending} 注未結算</div>` : ""}</td><td class="num">${b.hits}</td>
      <td class="num ${b.net > 0 ? "pos" : b.net < 0 ? "neg" : ""}">${money(b.net)}</td><td class="num">${pct(b.roi)}</td><td class="num">${pct(b.backtest_roi)}</td></tr>`).join("");
  const looks = (mn.looks || []).map(l => `<div class="sub">第 ${l.at} 場檢討:${l.compare.map(c => `${esc((p.books.find(b => b.key === c.strategy) || {}).name)} 每場 ${money(c.diff_per_race)}(z ${c.z})`).join(";")}。${l.switched_to ? "轉咗策略。" : "冇一個明顯好過,維持不變。"}</div>`).join("");
  el.innerHTML = `<section class="card">
    <h2 style="margin:0 0 4px">模擬倉</h2>
    <div class="sub">由 ${esc(p.start)} 開始 · 起始本金 $${p.bankroll.toLocaleString()} · 每注 $${p.stake} · 用開跑前最後一份賠率同固定咗嘅分析落注,按馬會真實派彩結算</div>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><b>$${mn.balance.toLocaleString()}</b>結餘(${mn.pending ? `包括 ${mn.pending} 注未結算` : "全部已結算"})</div>
      <div class="kpi"><b class="${mn.net > 0 ? "pos" : mn.net < 0 ? "neg" : ""}">${money(mn.net)}</b>淨賺蝕(已結算)</div>
      <div class="kpi"><b>${mn.hits} / ${mn.bets}</b>中 / 注數</div>
      <div class="kpi"><b>${esc(mn.following_name)}</b>而家跟緊嘅策略</div>
      <div class="kpi"><b>${p.races} / ${p.next_look}</b>已結算場數 / 下次檢討</div>
    </div>
  </section>
  <section class="card">
    <h3 style="margin:0 0 4px">每個賽馬日</h3>
    <div class="sub">撳日期睇注項同策略分析;最新一日預設打開</div>
    ${(p.meetings || []).map((mt, i) => paperMeetingBlock(p, mt, isOpen(mt, i), openMi.has(mt.date + mt.venue))).join("") || `<div class="sub">未有賽馬日</div>`}
  </section>
  <section class="card">
    <h3 style="margin:0 0 4px">四個策略比較</h3>
    <div class="sub">四個策略同時模擬,各自 $${p.bankroll.toLocaleString()} 本金;綠底係模擬倉跟緊嗰個</div>
    <div class="tw" style="margin-top:8px"><table><thead><tr><th>策略</th><th>結餘</th><th>注數</th><th>中</th><th>淨賺蝕</th><th>回報</th><th>過往回測</th></tr></thead><tbody>${books}</tbody></table></div>
    <div class="note" style="margin-top:10px">自動學習:每 ${p.look_every} 場將其他策略同模擬倉跟緊嗰個逐場比較,要明顯好過(z ≥ ${p.z_pass})先會轉,唔會因為一兩日輸贏而改。模型本身亦每晚用新賽果重新學習(見「賽事分析」頁底嘅「系統自我檢測」)。</div>
    ${looks}
    <div class="sub" style="margin-top:8px">回測入面呢幾種玩法全部都係蝕錢,預計模擬倉會慢慢蝕大約馬會抽水嘅幅度。呢個係實戰測試,唔係賺錢保證,亦唔係投注建議。</div>
  </section>`;
}

function perf(tr) {
  const h = data.model && data.model.holdout;
  const pct = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
  let html = "<h3 style='margin-top:0'>模型表現</h3>";
  if (h) {
    html += `<div class="sub">回測(${h.races} 場,由 ${esc(data.model.holdout_from)} 起,模型未見過嘅數據)</div><div class="kpis">
      <div class="kpi"><b>${pct(h.top_pick_win_rate)}</b>模型首選勝出率</div>
      <div class="kpi"><b>${pct(h.favourite_win_rate)}</b>大熱門勝出率(對照)</div>
      <div class="kpi"><b>${h.logloss}</b>Log loss(市場 ${h.market_logloss},隨機 ${h.uniform_logloss})</div>
      <div class="kpi"><b>${pct(h.flat_bet_roi_top_pick)}</b>首選平注回報率</div></div>`;
  }
  if (tr && tr.races) {
    html += `<div class="sub" style="margin-top:12px">實戰往績(賽前鎖定嘅預測)</div><div class="kpis">
      <div class="kpi"><b>${tr.races}</b>場</div>
      <div class="kpi"><b>${pct(tr.wins / tr.races)}</b>首選勝出</div>
      <div class="kpi"><b>${pct(tr.places / tr.races)}</b>首選入位</div>
      <div class="kpi"><b>${pct(tr.flat_roi)}</b>平注回報率</div></div>`;
  }
  $("#perf").innerHTML = html;
}

$("#refresh").onclick = load;
load();
// every 2 minutes on a race day, every 10 otherwise; skipped while the tab is hidden
let ticks = 0;
setInterval(() => {
  ticks++;
  if (document.hidden) return;
  if ((data && data.meeting.date === hkToday()) || ticks % 5 === 0) load();
}, 2 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
