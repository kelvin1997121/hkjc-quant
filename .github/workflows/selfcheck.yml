name: selfcheck

# Daily self-check: data health, walk-forward accuracy vs. market, calibration,
# factor contributions and guarded auto-tuning (writes data/model_config.json).
on:
  schedule:
    - cron: "37 19 * * *"   # 03:37 HKT, after the night's results are in
  workflow_dispatch:

permissions:
  actions: read    # to see whether the ticker is running
  contents: write

# GitHub's cron can fire hours late, so this has its own queue: sharing the update queue
# could hold up live updates during a meeting. The page reads selfcheck.json from the repo,
# so there's no need to publish the site here either.
concurrency:
  group: selfcheck
  cancel-in-progress: false

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-check
        env:
          HKJC_PROXY: ${{ secrets.HKJC_PROXY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m hkjc.selfcheck

      - name: Commit report
        run: |
          git config user.name "hkjc-bot"
          git config user.email "hkjc-bot@users.noreply.github.com"
          # learning.json is the record of which looks each self-improvement test has had.
          # Left out until 12 Nov 2026, so every run started from an empty record: harmless
          # below 300 new races, but from then on every test would have been judged daily.
          git add docs/data/selfcheck.json data/model_config.json data/learning.json
          git diff --cached --quiet && exit 0
          git commit -m "selfcheck: $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
