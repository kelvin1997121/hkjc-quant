name: ticker

# The clock for live updates. GitHub's own cron fires only a few times a day on this
# repo (4 Nov meeting: one run in the whole evening), so it can't drive race days.
# One long job triggers the "update" workflow every 5 minutes during a meeting and
# every 30 minutes otherwise from 08:00 HKT, plus the self-check once a night. It
# always hands over to a fresh run before the 6-hour job limit. If the relay ever
# breaks, the cron below or any update run restarts it, so to stop the clock on
# purpose disable this workflow rather than cancelling the run.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Act as if a meeting is on for 15 minutes (to check the 5-minute clock)"
        type: boolean
        default: false
  schedule:
    - cron: "11 */2 * * *"

permissions:
  actions: write   # to start the update workflow and the next ticker run
  contents: read

concurrency:
  group: ticker    # at most one ticker running, one waiting
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Trigger updates on the race-day clock
        run: |
          set +e   # a failed API call must not end the loop
          log() { echo "$(TZ=Asia/Hong_Kong date '+%F %H:%M') $*"; }
          to_min() { echo $(( 10#${1%:*} * 60 + 10#${1#*:} )); }

          # races whose post time was 6 to 45 minutes ago and that have no result on the page
          # yet (HKJC usually posts one 9 to 12 minutes after the post time)
          due_results() {
            python3 -c '
          import json, sys
          s, now = json.load(sys.stdin), int(sys.argv[1])
          done = set(s.get("resulted") or [])
          due = [n for n, t in (s.get("posts") or {}).items() if int(n) not in done
                 and 6 <= now - (int(t[:2]) * 60 + int(t[3:5])) <= 45]
          print(len(due))' "$1" <<<"$2" 2>/dev/null || echo 0
          }

          # minutes between updates right now; 0 = none
          interval() {
            local now today s d first last
            if [ "$(date +%s)" -lt "$test_until" ]; then echo 5; return; fi
            now=$(to_min "$(TZ=Asia/Hong_Kong date +%H:%M)")
            today=$(TZ=Asia/Hong_Kong date +%F)
            # through the API, not raw.githubusercontent.com: raw is cached for up to 5 minutes
            s=$(gh api "repos/$GH_REPO/contents/docs/data/schedule.json" -H "Accept: application/vnd.github.raw" 2>/dev/null) \
              || s=$(curl -fsS -m 20 "https://raw.githubusercontent.com/$GH_REPO/main/docs/data/schedule.json") || s='{}'
            d=$(jq -r '.date // ""' <<<"$s")
            first=$(jq -r '.first_post // ""' <<<"$s")
            last=$(jq -r '.last_post // ""' <<<"$s")
            if [ "$d" = "$today" ] && [ -n "$first" ] && [ -n "$last" ] \
               && [ "$now" -ge $(( $(to_min "$first") - 60 )) ] \
               && [ "$now" -le $(( $(to_min "$last") + 45 )) ]; then
              if [ "$(due_results "$now" "$s")" -gt 0 ]; then echo 2; else echo 5; fi
            elif [ "$now" -ge 480 ]; then
              echo 30
            else
              echo 0
            fi
          }
          busy() {
            gh run list --workflow update.yml --limit 5 --json status \
              --jq '[.[] | select(.status != "completed")] | length' | grep -qx '[1-9][0-9]*'
          }
          update_age() {
            gh run list --workflow update.yml --limit 1 --json createdAt \
              --jq '((now - (.[0].createdAt | fromdateiso8601)) / 60) | floor'
          }
          # started in the last 3 hours: a run from the evening must not cancel race morning's
          recent_trackwork() {
            gh run list --workflow trackwork.yml --limit 3 --json createdAt \
              --jq '[.[] | select((.createdAt | fromdateiso8601) > (now - 10800))] | length' \
              | grep -qx '[1-9][0-9]*'
          }
          recent_selfcheck() {
            gh run list --workflow selfcheck.yml --limit 3 --json createdAt \
              --jq '[.[] | select((.createdAt | fromdateiso8601) > (now - 43200))] | length' \
              | grep -qx '[1-9][0-9]*'
          }

          test_until=0
          if [ "${{ inputs.test }}" = "true" ]; then
            test_until=$(( $(date +%s) + 15 * 60 ))
            log "test: race-day clock for the next 15 minutes"
          fi
          end=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            hm=$(to_min "$(TZ=Asia/Hong_Kong date +%H:%M)")
            if [ "$hm" -ge 210 ] && [ "$hm" -lt 240 ]; then
              recent_selfcheck || { gh workflow run selfcheck.yml && log "triggered selfcheck"; }
              recent_trackwork || { gh workflow run trackwork.yml && log "triggered trackwork"; }
            fi
            every=$(interval)
            if [ "${every:-0}" -gt 0 ] && ! busy; then
              age=$(update_age)
              if [ "${age:-999}" -ge "$every" ]; then
                gh workflow run update.yml && log "triggered update (every $every min, last $age min ago)"
              fi
            fi
            sleep 60
          done

  relay:
    needs: tick
    if: ${{ !cancelled() }}   # a failed tick still hands over
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Hand over to the next ticker run
        # one failed API call here would stop the clock until a restart, so keep trying
        run: |
          for i in 1 2 3 4 5 6; do
            gh workflow run ticker.yml && exit 0
            sleep 30
          done
          exit 1
