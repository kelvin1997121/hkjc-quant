name: update

# Runs on GitHub's servers, so nothing needs to stay on at home.
# GitHub cron is UTC. HKT = UTC+8.
# Started by ticker.yml on the race-day clock; GitHub's cron here fires only a few
# times a day on this repo, so it is just a backup.
on:
  schedule:
    - cron: "13 0 * * *"           # 08:13 HKT daily: results catch-up + new race card
    - cron: "7,27,47 3-15 * * *"
  workflow_dispatch:

permissions:
  actions: write   # to restart the ticker and start publishing
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the ticker waits for this run, so a hang must not cost a race (slowest so far: 7)
    steps:
      - name: Restart the ticker if it has stopped
        # this run may have come from GitHub's cron or the PC backup, so either can revive the clock
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow ticker.yml --limit 5 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          echo "active ticker runs: $active"
          if [ "$active" = "0" ]; then gh workflow run ticker.yml && echo "ticker restarted"; fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Results first
        # race day: a race whose result is out goes on the page now, not after the odds
        # and the retraining below (about 2 minutes). Does nothing on other days.
        continue-on-error: true
        env:
          HKJC_PROXY: ${{ secrets.HKJC_PROXY }}
          HKJC_CONCURRENCY: "4"
          HKJC_RATE: "2"
        run: python -m hkjc results

      - name: Publish results first
        continue-on-error: true
        run: |
          git config user.name "hkjc-bot"
          git config user.email "hkjc-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "data: results $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1

      - name: Headless browser for live odds
        # use the runner's preinstalled Chrome; only install Chromium if it's missing
        run: command -v google-chrome || python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HKJC_PROXY: ${{ secrets.HKJC_PROXY }}
          # races run minutes apart, so a run must finish well inside the 5-minute clock
          HKJC_CONCURRENCY: "4"
          HKJC_RATE: "2"
        run: python -m hkjc run

      - name: Commit data
        run: |
          git config user.name "hkjc-bot"
          git config user.email "hkjc-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1

      - name: Publish the site, at most every 10 minutes
        # the page reads new data from the repo at once, so this needn't keep up with races
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          age=$(gh run list --workflow pages.yml --limit 1 --json createdAt \
            --jq '((now - (.[0].createdAt | fromdateiso8601)) / 60) | floor') || age=""
          if [ "${age:-999}" -ge 10 ]; then
            gh workflow run pages.yml && echo "publishing started"
          else
            echo "published $age minutes ago"
          fi
