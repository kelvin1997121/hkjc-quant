name: update

# Runs on GitHub's servers, so nothing needs to stay on at home.
# GitHub cron is UTC. HKT = UTC+8.
on:
  schedule:
    - cron: "0 0 * * *"          # 08:00 HKT daily: results catch-up + new race card
    - cron: "*/20 3-15 * * *"    # every 20 min, 11:00-23:59 HKT: live race-day updates
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HKJC_PROXY: ${{ secrets.HKJC_PROXY }}
        run: python -m hkjc run

      - name: Commit data
        run: |
          git config user.name "hkjc-bot"
          git config user.email "hkjc-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
