name: pages

# Publishes docs/ to GitHub Pages. Kept apart from the updates because a deployment can take
# up to 3 minutes and GitHub sometimes refuses it while it thinks another is running, which
# would slow or fail the 5-minute race-day clock. The page reads fresh data straight from the
# repo; this copy carries the page itself and a fallback for networks that block that route.
on:
  push:
    branches: [main]
    paths: [docs/index.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
