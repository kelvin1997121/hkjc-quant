name: backfill

# Manual: download older seasons and per-horse sectional times in the cloud.
# Stops after the time budget and commits what it has; run again to continue.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Earliest date to probe (YYYY-MM-DD)"
        default: "2022-09-01"
      to:
        description: "Latest date to probe (YYYY-MM-DD)"
        default: "2025-07-25"
      minutes:
        description: "Time budget in minutes"
        default: "300"

permissions:
  contents: write

concurrency:
  group: backfill   # separate from "update" so live race-day runs are never blocked
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Older seasons (55% of budget)
        env:
          HKJC_PROXY: ${{ secrets.HKJC_PROXY }}
        run: BACKFILL_MINUTES=$(( ${{ inputs.minutes }} * 55 / 100 )) python -m hkjc.backfill range ${{ inputs.from }} ${{ inputs.to }}

      - name: Sectional times (rest of budget)
        env:
          HKJC_PROXY: ${{ secrets.HKJC_PROXY }}
        run: BACKFILL_MINUTES=$(( ${{ inputs.minutes }} * 40 / 100 )) python -m hkjc.backfill sectionals

      - name: Commit data
        if: always()
        run: |
          git config user.name "hkjc-bot"
          git config user.email "hkjc-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: backfill $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          git pull --rebase -X theirs
          git push
